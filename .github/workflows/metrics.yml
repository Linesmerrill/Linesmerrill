name: Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

# Pinned to a master commit rather than v3.34: the last release (2023) has an
# achievements plugin that queries Projects (classic), which GitHub sunset in
# 2024, so it fails outright. Master fixes it. Pinned by SHA, not branch, to
# stay reproducible.
env:
  ACCENT_CSS: |
    h2, h2 * { color: #7A7ADB !important; fill: #7A7ADB !important; }

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Showpiece: identity, ranked achievement medals, isometric commit calendar.
      - name: Overview
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Linesmerrill
          committer_branch: metrics
          filename: overview.svg
          template: classic
          base: header
          config_timezone: America/Phoenix
          config_display: columns
          config_animations: yes
          extras_css: ${{ env.ACCENT_CSS }}
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Colored language proportion bars. 'recently-used' is omitted: it
      # rendered "No recent push activity found" on the previous run.
      - name: Languages
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Linesmerrill
          committer_branch: metrics
          filename: languages.svg
          base: ""
          config_timezone: America/Phoenix
          config_animations: yes
          extras_css: ${{ env.ACCENT_CSS }}
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_other: yes
          plugin_languages_details: percentage
          plugin_languages_ignored: html, groff, ejs, css, scss

      # Every year of contributions since account creation, as heatmaps.
      # Replaces the habits card: plugin_habits crashes on non-push events
      # ("Cannot destructure property 'author'"), unfixed on master.
      - name: Calendar
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Linesmerrill
          committer_branch: metrics
          filename: calendar.svg
          base: ""
          config_timezone: America/Phoenix
          config_animations: yes
          extras_css: ${{ env.ACCENT_CSS }}
          plugin_calendar: yes
          plugin_calendar_limit: 0
