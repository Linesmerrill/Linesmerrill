name: Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"
      - "scripts/generate_cards.py"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render cards
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          python3 scripts/generate_cards.py \
            --user Linesmerrill \
            --out out \
            --ignore "html,css,scss,ejs,groff,makefile,dockerfile,shell,batchfile"

      # Cards live on the 'metrics' branch: main requires pull requests, and
      # GITHUB_TOKEN cannot bypass that rule.
      - name: Publish to metrics branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin metrics
          git worktree add ../pub origin/metrics --detach
          cp out/*.svg ../pub/
          cd ../pub
          git add -A
          if git diff --cached --quiet; then
            echo "No change in rendered cards."
          else
            git commit -m "Update profile cards"
            git push origin HEAD:metrics
          fi
