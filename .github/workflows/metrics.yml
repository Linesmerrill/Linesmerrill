name: Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

# Generated SVGs land on the 'metrics' branch: main requires pull requests and
# GITHUB_TOKEN cannot bypass that rule.
#
# Deliberately NOT used here:
#   plugin_achievements - its query still requests Projects (classic), sunset
#     by GitHub in 2024, so it errors on every version including master.
#   plugin_habits - crashes on non-push events ("Cannot destructure 'author'").
#   plugin_calendar - multi-year grids overflow the card and render empty days
#     as harsh white cells.
#   config_display: columns - leaves half of each card blank.
env:
  ACCENT_CSS: |
    h2, h2 * { color: #7A7ADB !important; fill: #7A7ADB !important; }

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Left card: identity plus the isometric calendar, which carries the
      # streak and commits-per-day figures.
      - name: Overview
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Linesmerrill
          committer_branch: metrics
          filename: overview.svg
          template: classic
          base: header
          config_timezone: America/Phoenix
          config_animations: yes
          extras_css: ${{ env.ACCENT_CSS }}
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Right card: colored language proportion bars.
      - name: Languages
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Linesmerrill
          committer_branch: metrics
          filename: languages.svg
          base: ""
          config_timezone: America/Phoenix
          config_animations: yes
          extras_css: ${{ env.ACCENT_CSS }}
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_other: yes
          plugin_languages_details: percentage
          plugin_languages_ignored: html, groff, ejs, css, scss
