name: Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

# Generated SVGs are committed to the 'metrics' branch, not main:
# main requires pull requests, and GITHUB_TOKEN cannot bypass that rule.
env:
  ACCENT_CSS: |
    h2 { color: #7A7ADB !important; }
    .achievement .title { color: #7A7ADB !important; }

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Showpiece card: identity, achievement medals, and the isometric
      # commit calendar. Leads with graphics rather than stat lists.
      - name: Overview
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Linesmerrill
          committer_branch: metrics
          filename: overview.svg
          template: classic
          base: header
          config_timezone: America/Phoenix
          config_display: columns
          config_animations: yes
          extras_css: ${{ env.ACCENT_CSS }}
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Languages: colored proportion bars, most-used plus recently-used.
      - name: Languages
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Linesmerrill
          committer_branch: metrics
          filename: languages.svg
          base: ""
          config_timezone: America/Phoenix
          config_animations: yes
          extras_css: ${{ env.ACCENT_CSS }}
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_other: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: percentage
          plugin_languages_ignored: html, groff, ejs, css, scss

      # Coding habits: SVG time-of-day and day-of-week charts.
      - name: Habits
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Linesmerrill
          committer_branch: metrics
          filename: habits.svg
          base: ""
          config_timezone: America/Phoenix
          config_animations: yes
          extras_css: ${{ env.ACCENT_CSS }}
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
