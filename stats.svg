<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250" role="img" aria-label="GitHub stats">
<style>
  .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .title{font-size:13px;font-weight:600;fill:#7a7adb;}
  .hero{font-size:46px;font-weight:700;fill:#e6edf3;}
  .val{font-size:19px;font-weight:600;fill:#e6edf3;}
  .lab{font-size:11px;fill:#8b949e;letter-spacing:.02em;}
  .leg{font-size:11px;fill:#e6edf3;}
  .pct{font-size:11px;fill:#8b949e;}
</style>
<rect x="0.5" y="0.5" width="479" height="249" rx="12"
      fill="#0d1117" stroke="#30363d"/>
<g class="t">
  <rect x="20" y="20" width="3" height="13" rx="1.5" fill="#7a7adb"/>
  <text x="31" y="31" class="title">GitHub stats</text>
  <text x="20" y="96" class="hero">22,093</text>
  <text x="20" y="115" class="lab">Total commits &#183; 10 years on GitHub</text>
  <text x="20" y="158" class="val">758</text><text x="20" y="174" class="lab">Pull requests</text>
  <text x="173" y="158" class="val">73</text><text x="173" y="174" class="lab">Reviews</text>
  <text x="326" y="158" class="val">351</text><text x="326" y="174" class="lab">Issues</text>
  <text x="20" y="204" class="val">136</text><text x="20" y="220" class="lab">Repositories</text>
  <text x="173" y="204" class="val">17</text><text x="173" y="220" class="lab">Contributed to</text>
  <text x="326" y="204" class="val">52</text><text x="326" y="220" class="lab">Followers</text>
</g>
</svg>
